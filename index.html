<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หน้าหลัก | Portfolio</title>

<style>
* {
    box-sizing: border-box;
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    color: white;
    min-height: 100vh;
    background:
        radial-gradient(circle at 10% 20%, #ff69b4 0, transparent 25%),
        radial-gradient(circle at 90% 10%, #00c6ff 0, transparent 25%),
        radial-gradient(circle at 80% 90%, #8e2de2 0, transparent 30%),
        linear-gradient(135deg, #141e30, #243b55);
}

/* เมนู */
nav {
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(12px);
    padding: 18px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 10px;
    font-weight: bold;
}

nav a:hover {
    color: #00e5ff;
}

/* กล่องหลัก */
.container {
    max-width: 900px;
    margin: auto;
    padding: 60px 20px;
}

.card {
    background: rgba(255,255,255,0.13);
    backdrop-filter: blur(15px);
    padding: 45px;
    border-radius: 25px;
    border: 1px solid rgba(255,255,255,0.25);
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    text-align: center;
}

/* รูปโปรไฟล์ */
.profile-img {
    width: 200px;
    height: 200px;
    object-fit: cover;
    border-radius: 50%;
    border: 5px solid #00e5ff;
    box-shadow: 0 0 30px #00e5ff;
}

h1 {
    font-size: 45px;
    margin-bottom: 10px;
}

h2 {
    color: #00e5ff;
}

p {
    font-size: 18px;
    line-height: 1.8;
}

/* ปุ่ม */
.btn {
    display: inline-block;
    margin-top: 20px;
    padding: 13px 28px;
    border-radius: 30px;
    background: linear-gradient(45deg, #00c6ff, #8e2de2);
    color: white;
    text-decoration: none;
    font-weight: bold;
    box-shadow: 0 0 20px rgba(0,198,255,0.5);
}

.btn:hover {
    transform: scale(1.05);
}

footer {
    text-align: center;
    padding: 25px;
    background: rgba(0,0,0,0.35);
}

@media(max-width:600px) {
    nav a {
        display: inline-block;
        margin: 6px;
        font-size: 14px;
    }

    .card {
        padding: 30px 20px;
    }

    h1 {
        font-size: 32px;
    }

    .profile-img {
        width: 150px;
        height: 150px;
    }
}
</style>
</head>

<body>

<nav>

    <a href="portfolio.html">ผลงาน</a>
    <a href="contact.html">ติดต่อ</a>
</nav>

<div class="container">
    <div class="card">

        <img src="WIN_20260612_10_28_34_Pro.jpg"
             alt="รูปโปรไฟล์"
             class="profile-img">

        <h1>PORTFOLIO</h1>

        <h2>นายธนโชติ วรรณวิสิทธิ์</h2>

        <p>ยินดีต้อนรับเข้าสู่เว็บไซต์ Portfolio ของผม</p>

        <p>

        <a href="about.html" class="btn">
            ดูข้อมูลเพิ่มเติม
        </a>

    </div>
</div>

<footer>
    © 2026 Portfolio | นายธนโชติ วรรณวิสิทธิ์
</footer>

</body>
</html>
